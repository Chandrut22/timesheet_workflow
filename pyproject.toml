[project]
name = "workflow"
version = "0.2.0"
description = "Genworx Timesheet Processing Assistant: IMAP listener + Docling/LLM extraction + rule checks"
readme = "README.md"
authors = [
    { name = "Chandru", email = "chandrutd22@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling[rapidocr]>=2.135.0",
    "img2pdf>=0.6.3",
    "imap-tools>=1.7",
    "langchain>=1.4.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "openai>=3.26.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pydantic>=2.14.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "rapidocr==3.9.2",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
